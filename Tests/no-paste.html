<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>复制鸭 · 禁止粘贴测试</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, sans-serif; color: #30383d; background: #f6f7f5; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 48px 20px; }
    main { max-width: 720px; margin: auto; padding: 32px; background: white; border: 1px solid #e7eae4; border-radius: 20px; }
    header { display: flex; gap: 16px; align-items: center; margin-bottom: 24px; }
    svg { width: 64px; height: 64px; flex-shrink: 0; }
    h1 { margin: 0 0 6px; font-size: 24px; }
    header p { margin: 0; color: #74806f; font-size: 13px; }
    .instructions { font-size: 14px; line-height: 1.8; color: #60686c; }
    label { display: block; margin: 22px 0 10px; font-size: 14px; font-weight: 600; }
    textarea { display: block; width: 100%; min-height: 260px; padding: 16px; border: 1px solid #d9dfd6; border-radius: 12px; resize: vertical; background: #fcfdfb; color: #30383d; font: inherit; line-height: 1.6; }
    textarea:focus-visible, button:focus-visible { outline: 3px solid #90ad80; outline-offset: 3px; }
    .footer { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-top: 16px; }
    #status { margin: 0; flex: 1; font-size: 13px; min-width: 160px; color: #667361; }
    #status[data-blocked="true"] { color: #aa5837; }
    button { padding: 8px 14px; border: 1px solid #dfe3db; border-radius: 8px; background: white; color: #4c565b; font: inherit; font-size: 13px; cursor: pointer; }
    button:hover { background: #f5f7f2; }
    .note { margin: 20px 0 0; color: #929991; font-size: 12px; line-height: 1.6; }
    @media (max-width: 480px) { body { padding: 20px 12px; } main { padding: 22px; } h1 { font-size: 21px; } }
  </style>
</head>
<body>
  <main>
    <header>
      <svg viewBox="0 0 100 100" fill="none" aria-hidden="true">
        <path d="M27 49C19 59 23 76 39 79C57 84 79 78 79 61C79 53 73 49 75 40C80 21 61 12 51 22C44 29 47 37 46 44C44 51 33 52 26 46Z" fill="#fff" stroke="#3e484d" stroke-width="2.7" stroke-linejoin="round"/>
        <path d="M76 31L87 36L76 41Z" fill="#ffc266" stroke="#3e484d" stroke-width="2.3" stroke-linejoin="round"/>
        <circle cx="67" cy="29" r="1.7" fill="#3e484d"/>
        <path d="M41 63C47 69 57 70 63 66M58 17L56 12M61 17L64 12" stroke="#3e484d" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
      <div><h1>复制鸭输入测试</h1><p>普通粘贴和拖入文字已禁用</p></div>
    </header>
    <p class="instructions" id="instructions">先复制一段文字，点下面的输入框，再按你设置的<strong>复制鸭快捷键</strong>。<br>可以先按 ⌘V，确认普通粘贴确实被拦截。</p>
    <label for="test-input">测试输入框</label>
    <textarea id="test-input" placeholder="点这里，再用复制鸭输入。" aria-describedby="instructions" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>
    <div class="footer">
      <p id="status" role="status" aria-live="polite">等待输入 · 0 个字符</p>
      <button id="clear" type="button">清空</button>
    </div>
    <p class="note">支持正常打字、中文输入法和换行。内容只留在当前页面，关闭或刷新后清空。</p>
  </main>
  <script>
    'use strict';
    const field = document.getElementById('test-input');
    const status = document.getElementById('status');
    const count = () => Array.from(field.value).length;
    const blockedTypes = new Set(['insertFromPaste', 'insertFromPasteAsQuotation', 'insertFromDrop']);

    function block(event, message) {
      event.preventDefault();
      status.dataset.blocked = 'true';
      status.textContent = `${message} · 当前 ${count()} 个字符`;
    }

    // Cancel the clipboard/drop actions, while leaving IME composition and insertText intact.
    document.addEventListener('paste', event => block(event, '普通粘贴已拦截，请使用复制鸭快捷键'), true);
    field.addEventListener('dragover', event => event.preventDefault());
    document.addEventListener('drop', event => block(event, '拖入文字已拦截'), true);
    field.addEventListener('beforeinput', event => {
      if (blockedTypes.has(event.inputType) && event.cancelable) {
        block(event, '普通粘贴或拖入文字已拦截');
      }
    });
    field.addEventListener('input', () => {
      status.dataset.blocked = 'false';
      status.textContent = `已输入 ${count()} 个字符`;
    });
    document.getElementById('clear').addEventListener('click', () => {
      field.value = '';
      status.dataset.blocked = 'false';
      status.textContent = '已清空 · 0 个字符';
      field.focus();
    });
  </script>
</body>
</html>
